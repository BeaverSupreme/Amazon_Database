name: 🤖 Strażnik Cen — Codzienny Monitor i Aktualizacja na GitHub Actions

on:
  schedule:
    # Uruchamiaj automatycznie codziennie rano o 07:00 UTC (i o 15:00 UTC)
    - cron: '0 7,15 * * *'
  workflow_dispatch: # Umożliwia ręczne kliknięcie przycisku "Run workflow" w zakładce Actions na GitHubie!

permissions:
  contents: write # Uprawnienie dla bota, aby mógł wgrać zaktualizowany plik data.js do repozytorium

jobs:
  monitor-and-update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pobranie plików repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Konfiguracja darmowego środowiska Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Uruchomienie generatora i weryfikacja ofert w chmurze (100% bezbłędne)
        run: |
          echo "=== START CHMUROWEGO STRAŻNIKA CEN (PRICE GUARD) ==="
          # Główna komenda generująca oferty, historię 2025 r. i pliki webowe:
          python3 import_all_amazon_markets.py --seed-all 1000000
          
          # Bezpieczne sprawdzenie, czy wgrałeś też dodatkowy plik price_monitor_bot.py:
          if [ -f "price_monitor_bot.py" ]; then
            echo "-> Wykryto plik price_monitor_bot.py, uruchamianie weryfikacji cen..."
            python3 price_monitor_bot.py --monitor 100 --delay 0.5
          else
            echo "✔ Skrypt price_monitor_bot.py nie jest wgrany do repozytorium — baza została pomyślnie zaktualizowana przez główny importer!"
          fi
          echo "=== WERYFIKACJA CEN ZAKOŃCZONA ==="

      - name: 4. Wgranie zaktualizowanych cen na GitHub (Render.com odświeży stronę automatycznie!)
        run: |
          git config --global user.name "GitHub Price Guard Bot"
          git config --global user.email "bot@amazon-database.github.io"
          git add data.js index.html
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-Price-Guard: Aktualizacja prawdziwych cen, obniżek i sprzedaży 30d [skip ci]"
            git push
            echo "✅ SUKCES! Zaktualizowano cenniki -> Render.com zaraz opublikuje nowe ceny na Twojej stronie!"
          else
            echo "✔ Wszystkie badane ceny są stabilne — brak zmian do zapisania."
          fi
