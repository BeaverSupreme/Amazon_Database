name: Straznik Cen

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
         python3 import_all_amazon_markets.py --seed-all 100000 --monitor-prices 100000
      - run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add data.js index.html
          git commit -m "Auto-update" || true
          git push || true
